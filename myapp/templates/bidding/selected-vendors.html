{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Vendors — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="page-head">
        <div class="ph-title">
          <h1>Selected Vendors</h1>
          <p>Vendors selected by customers for jobs — including divided work assignments</p>
        </div>
        <div class="ph-actions">
          <a class="btn btn-outline btn-sm" href="index.html"><i class="fa-solid fa-gavel"></i> All Bids</a>
        </div>
      </div>

      <div class="alert alert-info">
        <i class="fa-solid fa-circle-info"></i> Customers can select <strong>multiple vendors</strong> for a Long Job and divide the required work between them. Admin can view all assignments below.
      </div>

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Bidding', href: '#' },
        { label: 'Selected Vendors' }
      ]);

      var selected = D.bids.filter(function (b) { return b.status === 'selected'; });

      U.createTable({
        mount: '#tableMount',
        data: selected,
        searchKeys: ['id', 'jobTitle', 'vendor', 'customer'],
        searchPlaceholder: 'Search selected vendors…',
        exportName: 'selected-vendors',
        pageSize: 10,
        filters: [
          {
            key: 'vendorType',
            options: [
              { value: 'all', label: 'All Vendor Types' },
              { value: 'company', label: 'Company Vendor' },
              { value: 'outsider', label: 'Outsider Vendor' }
            ],
            match: function (r, v) { return r.vendorType === v; }
          }
        ],
        columns: [
          { key: 'jobTitle', label: 'Job', sortable: true, render: function (r) { return '<strong>' + U.esc(r.jobTitle) + '</strong><div class="text-muted" style="font-size:12px;">' + r.jobId + '</div>'; } },
          { key: 'customer', label: 'Customer', sortable: true, render: function (r) { return U.userCell(r.customer, '', r.customerId); } },
          { key: 'vendor', label: 'Vendor', sortable: true, render: function (r) { return U.userCell(r.vendor, r.vendorEmail, r.vendorId); } },
          { key: 'vendorType', label: 'Vendor Type', sortable: true, render: function (r) { return U.badge(r.vendorType); } },
          { key: 'quotation', label: 'Quotation', sortable: true, render: function (r) { return '<strong>' + U.inr(r.quotation) + '</strong>'; } },
          { key: 'assignedWork', label: 'Assigned Work', render: function (r) { return r.assignedWork ? U.esc(r.assignedWork) : '<span class="text-muted">—</span>'; } },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return U.badge(r.status); } },
          { key: 'selectionDate', label: 'Selection Date', sortable: true, render: function (r) { return r.selectionDate || '—'; } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'view', icon: 'fa-eye', title: 'View Bid', cls: 'view' },
                { action: 'job', icon: 'fa-briefcase', title: 'View Job', cls: 'edit' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'view') {
            location.href = 'bid-details.html?id=' + row.id;
          } else if (act === 'job') {
            location.href = '../jobs/details.html?id=' + row.jobId;
          }
        }
      });
    })();
  </script>
</body>
</html>
