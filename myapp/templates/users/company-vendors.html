{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Vendors — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="page-head">
        <div class="ph-title">
          <h1>Company Vendors</h1>
          <p>Vendors registered under company partnerships</p>
        </div>
        <div class="ph-actions">
          <a class="btn btn-outline btn-sm" href="vendors.html"><i class="fa-solid fa-users"></i> All Vendors</a>
          <a class="btn btn-outline btn-sm" href="outsider-vendors.html"><i class="fa-solid fa-user-gear"></i> Outsider Vendors</a>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script src="{% static 'assets/js/vendor-table.js' %}"></script>
  <script>
    (function () {
      'use strict';
      AdminComponents.renderBreadcrumb([
        { label: 'Users', href: '#' },
        { label: 'Company Vendors' }
      ]);
      VendorTable.init({ type: 'company', exportName: 'company-vendors' });
    })();
  </script>
</body>
</html>
