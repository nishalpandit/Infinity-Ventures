{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Purchases — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="page-head">
        <div class="ph-title">
          <h1>Subscription Purchases</h1>
          <p>All bid-package purchases made by vendors</p>
        </div>
        <div class="ph-actions">
          <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fa-solid fa-file-export"></i> Export</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Subscriptions', href: '#' },
        { label: 'Purchases' }
      ]);

      U.createTable({
        mount: '#tableMount',
        data: D.purchases,
        searchKeys: ['id', 'vendor', 'vendorId', 'package'],
        searchPlaceholder: 'Search purchases…',
        exportName: 'subscription-purchases',
        pageSize: 10,
        filters: [
          {
            key: 'paymentStatus',
            options: [
              { value: 'all', label: 'All Status' },
              { value: 'success', label: 'Success' },
              { value: 'failed', label: 'Failed' }
            ],
            match: function (r, v) { return r.paymentStatus === v; }
          },
          {
            key: 'vendorType',
            options: [
              { value: 'all', label: 'All Vendor Types' },
              { value: 'company', label: 'Company Vendor' },
              { value: 'outsider', label: 'Outsider Vendor' }
            ],
            match: function (r, v) { return r.vendorType === v; }
          }
        ],
        columns: [
          { key: 'id', label: 'Transaction ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'vendor', label: 'Vendor', sortable: true, render: function (r) { return U.userCell(r.vendor, '', r.vendorId); } },
          { key: 'vendorType', label: 'Vendor Type', sortable: true, render: function (r) { return U.badge(r.vendorType); } },
          { key: 'package', label: 'Package', sortable: true, render: function (r) { return '<strong>' + U.esc(r.package) + '</strong>'; } },
          { key: 'credits', label: 'Bid Credits', sortable: true, render: function (r) { return '<span class="count-pill blue">' + r.credits + '</span>'; } },
          { key: 'amount', label: 'Amount', sortable: true, render: function (r) { return '<strong>' + U.inr(r.amount) + '</strong>'; } },
          { key: 'paymentStatus', label: 'Payment Status', sortable: true, render: function (r) { return U.badge(r.paymentStatus); } },
          { key: 'date', label: 'Purchase Date', sortable: true, render: function (r) { return r.date; } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'view', icon: 'fa-eye', title: 'View Details', cls: 'view' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'view') {
            location.href = '../payments/transaction-details.html?id=' + row.id;
          }
        }
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        U.toast('info', 'Preparing export', 'Purchases list is being exported to CSV.');
      });
    })();
  </script>
</body>
</html>
