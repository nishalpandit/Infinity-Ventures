{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Details — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="pageContent">
        <div class="state-box"><div class="spinner"></div><p>Loading bid…</p></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;
      var id = U.qs('id') || 'BID-4001';
      var bid = D.find(D.bids, id) || D.bids[0];
      var job = D.find(D.jobs, bid.jobId);

      AdminComponents.renderBreadcrumb([
        { label: 'Bidding', href: 'index.html' },
        { label: bid.id }
      ]);

      function render() {
        var html = '';

        /* Hero */
        html += '<div class="detail-hero card">' +
          '<div class="dh-left">' +
          '<span class="avatar avatar-xl ' + U.avatarClass(bid.id) + '"><i class="fa-solid fa-gavel"></i></span>' +
          '<div><h2>Bid ' + bid.id + '</h2>' +
          '<div class="dh-meta"><span class="mono">' + bid.id + '</span> ' + U.badge(bid.status) + '</div>' +
          '<div class="dh-sub"><i class="fa-solid fa-briefcase"></i> ' + U.esc(bid.jobTitle) +
          ' &nbsp;·&nbsp; <i class="fa-regular fa-calendar"></i> Submitted ' + bid.submitted + '</div></div>' +
          '</div>' +
          '<div class="dh-actions">' +
          '<a class="btn btn-outline btn-sm" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>' +
          (bid.status === 'submitted' ? '<button class="btn btn-danger btn-sm" id="rejectBtn"><i class="fa-solid fa-circle-xmark"></i> Reject Bid</button>' : '') +
          '</div></div>';

        /* Policy notice */
        html += '<div class="alert alert-info" style="margin-top:20px;">' +
          '<i class="fa-solid fa-lock"></i> <strong>Bid Policy:</strong> Once submitted, a quotation CANNOT be edited or revised, ' +
          'and the vendor CANNOT submit another quotation for the same job. ' +
          'Withdrawn or rejected bids do NOT receive a credit refund.</div>';

        /* Stats */
        var stats = [
          { label: 'Quotation Amount', value: U.inr(bid.quotation), icon: 'fa-indian-rupee-sign', cls: 'icon-green' },
          { label: 'Bid Credit Used', value: bid.creditUsed, icon: 'fa-coins', cls: 'icon-purple' },
          { label: 'Estimated Time', value: bid.estimatedTime, icon: 'fa-stopwatch', cls: 'icon-blue' },
          { label: 'Status', value: bid.status, icon: 'fa-circle-info', cls: 'icon-indigo' }
        ];
        html += '<div class="stat-grid" style="margin-top:20px;">' + stats.map(function (s) {
          return '<div class="stat-card static"><span class="stat-icon ' + s.cls + '"><i class="fa-solid ' + s.icon + '"></i></span>' +
            '<div class="stat-info"><div class="label">' + s.label + '</div><div class="value">' + s.value + '</div></div></div>';
        }).join('') + '</div>';

        /* Bid + Job + Vendor info */
        html += '<div class="row g-4" style="margin-top:20px;">';
        html += '<div class="col-lg-6"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-gavel"></i> Bid Information</h6></div><div class="card-body">' +
          infoRow('fa-hashtag', 'Bid ID', bid.id) +
          infoRow('fa-briefcase', 'Job', bid.jobTitle + ' (' + bid.jobId + ')') +
          infoRow('fa-user', 'Customer', job ? job.customer : '—') +
          infoRow('fa-file-invoice-dollar', 'Quotation Amount', U.inr(bid.quotation)) +
          infoRow('fa-coins', 'Bid Credit Used', bid.creditUsed + ' credit(s)') +
          infoRow('fa-calendar', 'Submitted Date', bid.submitted) +
          infoRow('fa-circle-info', 'Status', bid.status) +
          '</div></div></div>';

        html += '<div class="col-lg-6"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-user-gear"></i> Vendor Information</h6></div><div class="card-body">' +
          infoRow('fa-user', 'Vendor', bid.vendor) +
          infoRow('fa-id-card', 'Vendor ID', bid.vendorId) +
          infoRow('fa-user-tag', 'Vendor Type', bid.vendorType === 'company' ? 'Company Vendor' : 'Outsider Vendor') +
          infoRow('fa-envelope', 'Email', bid.vendorEmail) +
          infoRow('fa-star', 'Rating', bid.rating + ' / 5.0') +
          infoRow('fa-briefcase', 'Experience', bid.experience + ' years') +
          '</div></div></div>';
        html += '</div>';

        /* Quotation details */
        html += '<div class="card" style="margin-top:20px;"><div class="card-header"><h6><i class="fa-solid fa-file-lines"></i> Quotation Details</h6></div><div class="card-body">' +
          '<h6 class="mb-2">Work Description</h6><p class="text-muted">' + U.esc(bid.workDescription) + '</p>' +
          '<h6 class="mb-2">Quotation Details</h6><p class="text-muted">' + U.esc(bid.quotationDetails) + '</p>' +
          '<h6 class="mb-2">Estimated Completion Time</h6><p class="text-muted">' + U.esc(bid.estimatedTime) + '</p>' +
          '</div></div>';

        document.getElementById('pageContent').innerHTML = html;

        var rejectBtn = document.getElementById('rejectBtn');
        if (rejectBtn) {
          rejectBtn.addEventListener('click', function () {
            U.confirm({
              title: 'Reject bid?',
              message: bid.vendor + "'s bid on " + bid.jobTitle + ' will be rejected. The bid credit will NOT be returned.',
              danger: true, icon: 'fa-circle-xmark', confirmText: 'Reject Bid',
              onConfirm: function () {
                bid.status = 'rejected';
                U.toast('warning', 'Bid rejected', bid.id + ' has been rejected. Credit not returned.');
                render();
              }
            });
          });
        }
      }

      function infoRow(icon, label, value) {
        return '<div class="ib-row"><span class="ib-icon"><i class="fa-solid ' + icon + '"></i></span>' +
          '<div><div class="ib-label">' + label + '</div><div class="ib-value">' + U.esc(value) + '</div></div></div>';
      }

      setTimeout(render, 350);
    })();
  </script>
</body>
</html>
