{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Service Details — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="pageContent">
        <div class="state-box"><div class="spinner"></div><p>Loading service…</p></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;
      var id = U.qs('id') || 'QS-1001';
      var svc = D.find(D.quickServices, id) || D.quickServices[0];

      AdminComponents.renderBreadcrumb([
        { label: 'Quick Services', href: 'index.html' },
        { label: svc.id }
      ]);

      var requests = D.vendorRequests.filter(function (r) { return r.serviceId === svc.id; });

      function render() {
        var html = '';

        /* Hero */
        html += '<div class="detail-hero card">' +
          '<div class="dh-left">' +
          '<span class="avatar avatar-xl ' + U.avatarClass(svc.id) + '"><i class="fa-solid fa-bolt"></i></span>' +
          '<div><h2>' + U.esc(svc.title) + '</h2>' +
          '<div class="dh-meta"><span class="mono">' + svc.id + '</span> ' + U.badge(svc.status) + '</div>' +
          '<div class="dh-sub"><i class="fa-solid fa-layer-group"></i> ' + U.esc(svc.category) +
          ' &nbsp;·&nbsp; <i class="fa-solid fa-location-dot"></i> ' + U.esc(svc.location) +
          ' &nbsp;·&nbsp; <i class="fa-regular fa-calendar"></i> Created ' + svc.created + '</div></div>' +
          '</div>' +
          '<div class="dh-actions">' +
          '<a class="btn btn-outline btn-sm" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>' +
          '</div></div>';

        /* Stats */
        var stats = [
          { label: 'Budget', value: U.inr(svc.budget), icon: 'fa-indian-rupee-sign', cls: 'icon-green' },
          { label: 'Vendor Requests', value: svc.vendorRequests, icon: 'fa-handshake', cls: 'icon-indigo' },
          { label: 'Selected Vendor', value: svc.selectedVendor === '—' ? 'None' : svc.selectedVendor, icon: 'fa-user-check', cls: 'icon-teal' },
          { label: 'Status', value: svc.status, icon: 'fa-circle-info', cls: 'icon-blue' }
        ];
        html += '<div class="stat-grid" style="margin-top:20px;">' + stats.map(function (s) {
          return '<div class="stat-card static"><span class="stat-icon ' + s.cls + '"><i class="fa-solid ' + s.icon + '"></i></span>' +
            '<div class="stat-info"><div class="label">' + s.label + '</div><div class="value">' + s.value + '</div></div></div>';
        }).join('') + '</div>';

        /* Customer + Service info */
        html += '<div class="row g-4" style="margin-top:20px;">';
        html += '<div class="col-lg-4"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-user"></i> Customer</h6></div><div class="card-body">' +
          infoRow('fa-user', 'Name', svc.customer) +
          infoRow('fa-phone', 'Contact', svc.customerMobile) +
          infoRow('fa-location-dot', 'Location', svc.location) +
          '</div></div></div>';

        html += '<div class="col-lg-8"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-bolt"></i> Service Details</h6></div><div class="card-body">' +
          '<div class="row g-3">' +
          infoCol('Title', svc.title) +
          infoCol('Category', svc.category) +
          infoCol('Budget', U.inr(svc.budget)) +
          infoCol('Date', svc.date) +
          infoCol('Time', svc.time) +
          infoCol('Shift Availability', svc.shift) +
          '</div>' +
          '<hr>' +
          '<h6 class="mb-2">Description</h6><p class="text-muted">' + U.esc(svc.description) + '</p>' +
          '<h6 class="mb-2">Required Work</h6><p class="text-muted">' + U.esc(svc.requiredWork) + '</p>' +
          (svc.additionalDetails ? '<h6 class="mb-2">Additional Details</h6><p class="text-muted">' + U.esc(svc.additionalDetails) + '</p>' : '') +
          (svc.attachments && svc.attachments.length ? '<h6 class="mb-2">Attachments</h6><div class="attachment-list">' +
            svc.attachments.map(function (a) { return '<span class="attachment-chip"><i class="fa-solid fa-paperclip"></i> ' + U.esc(a) + '</span>'; }).join('') + '</div>' : '') +
          '</div></div></div>';
        html += '</div>';

        /* Vendor Requests */
        html += '<div class="card" style="margin-top:20px;"><div class="card-header"><h6><i class="fa-solid fa-handshake"></i> Vendor Requests (' + requests.length + ')</h6></div><div class="card-body p-0">';
        if (requests.length === 0) {
          html += '<div class="state-box"><div class="state-icon"><i class="fa-regular fa-folder-open"></i></div><h5>No vendor requests</h5><p>No vendors have requested this service yet.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="table"><thead><tr>' +
            '<th>Vendor</th><th>Vendor Type</th><th>Quotation</th><th>Rating</th><th>Experience</th><th>Submitted</th><th>Status</th>' +
            '</tr></thead><tbody>' +
            requests.map(function (r) {
              return '<tr>' +
                '<td>' + U.userCell(r.vendor, r.vendorEmail, r.vendorId) + '</td>' +
                '<td>' + U.badge(r.vendorType) + '</td>' +
                '<td><strong>' + U.inr(r.quotation) + '</strong></td>' +
                '<td>' + U.stars(r.rating) + '</td>' +
                '<td>' + r.experience + ' yrs</td>' +
                '<td>' + r.submitted + '</td>' +
                '<td>' + U.badge(r.status) + '</td>' +
                '</tr>';
            }).join('') +
            '</tbody></table></div>';
        }
        html += '</div></div>';

        document.getElementById('pageContent').innerHTML = html;
      }

      function infoRow(icon, label, value) {
        return '<div class="ib-row"><span class="ib-icon"><i class="fa-solid ' + icon + '"></i></span>' +
          '<div><div class="ib-label">' + label + '</div><div class="ib-value">' + U.esc(value) + '</div></div></div>';
      }

      function infoCol(label, value) {
        return '<div class="col-md-6"><div class="info-col"><div class="ic-label">' + label + '</div><div class="ic-value">' + U.esc(value) + '</div></div></div>';
      }

      setTimeout(render, 350);
    })();
  </script>
</body>
</html>
