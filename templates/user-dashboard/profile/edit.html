<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Suggu Services User Portal - Edit Profile">
  <title>Edit Profile · Suggu Services User</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script defer src="../assets/app.js"></script>
</head>
<body data-page="profile-edit" data-title="Edit Profile" data-root="../">
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div class="workspace">
      <div id="topbar-root"></div>
      <main class="page">
        <div class="page-head">
          <div class="actions">
            <a class="btn btn-secondary" href="index.html">Cancel</a>
          </div>
        </div>

        <section class="card" style="max-width:900px">
          <form method="POST" action="edit.html" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-section">
              <div class="form-grid">
                <div class="field full">
                  <label>Full Name <span class="required">*</span></label>
                  <input class="input" name="first_name" required value="{{ request.user.first_name|default:request.user.username }}">
                </div>
                <div class="field">
                  <label>Mobile <span class="required">*</span></label>
                  <input class="input" name="phone_number" required value="{{ request.user.user_profile.phone_number|default:'' }}" placeholder="+91 98765 43210">
                </div>
                <div class="field">
                  <label>Email <span class="required">*</span></label>
                  <input class="input" type="email" name="email" required value="{{ request.user.email|default:'' }}">
                </div>
              </div>
            </div>

            <div class="form-actions">
              <a class="btn btn-secondary" href="index.html">Cancel</a>
              <button class="btn btn-primary" type="submit"><span data-icon="check"></span> Save Changes</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
