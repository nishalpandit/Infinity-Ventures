<!doctype html>
    <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fixora user Portal — Edit Profile"><title>Edit Profile · Fixora user</title><link rel="stylesheet" href="/user-dashboard/assets/styles.css"><script defer src="/user-dashboard/assets/app.js"></script></head>
    <body data-page="profile-edit" data-title="Edit Profile" data-root="../"><div class="app-shell"><div id="sidebar-root"></div><div class="workspace"><div id="topbar-root"></div><main class="page">
<section class="card" style="max-width:900px"><form class="needs-validation" data-success-title="Profile updated" data-success-message="Your profile changes have been saved."><div class="form-section"><div class="field"><label>Profile photo</label><div class="cell-user"><span class="avatar xl teal">AS</span><div class="stack" style="gap:8px"><label class="btn btn-secondary btn-sm"><span data-icon="camera"></span> Change photo<input type="file" accept="image/*" hidden data-preview="profile-photo-preview"></label><button type="button" class="btn btn-ghost btn-sm" data-toast="Photo removed">Remove</button></div></div><div id="profile-photo-preview" class="preview-list"></div></div></div><div class="form-section"><div class="form-grid"><div class="field full"><label>Full name <span class="required">*</span></label><input class="input" required value="Ananya Sharma"></div><div class="field"><label>Mobile <span class="required">*</span></label><input class="input" required value="+91 98765 43210"></div><div class="field"><label>Email <span class="required">*</span></label><input class="input" type="email" required value="ananya.sharma@example.com"></div><div class="field"><label>Date of birth</label><input class="input" type="date" value="1994-06-14"></div><div class="field"><label>Gender</label><select class="select"><option>Prefer not to say</option><option selected>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Preferred language</label><select class="select"><option>English</option><option>Hindi</option><option>Bengali</option></select></div></div></div><div class="form-actions"><a class="btn btn-secondary" href="index.html">Cancel</a><button class="btn btn-primary" type="submit"><span data-icon="check"></span> Save Changes</button></div></form></section>
</main></div></div></body></html>
