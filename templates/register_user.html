{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create User Account - Suggu Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-border: #c7d2fe;

      --ink: #0f172a;
      --slate: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --bg: #f3f4f6;
      --card-bg: #ffffff;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--slate);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
    }

    /* Main White Form Container */
    .user-card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 6px -2px rgba(15, 23, 42, 0.02);
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Top Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      background: var(--line-soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: all 0.15s ease;
    }
    .back-btn:hover {
      background: #e2e8f0;
      color: var(--ink);
    }
    .brand-mark {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.2px;
      text-transform: uppercase;
    }

    /* Header Area */
    .header-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .header-area h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header-area p {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }

    /* Alert Messages */
    .alert-box {
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
    .alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
    }
    .form-group {
      position: relative;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate);
    }
    .input-wrap {
      position: relative;
    }
    .form-control {
      width: 100%;
      height: 42px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: var(--ink);
      padding: 0 14px 0 38px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .form-control::placeholder {
      color: #94a3b8;
    }
    .file-input {
      padding: 7px 12px 7px 38px;
      font-size: 13px;
    }

    .icon-left {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 13.5px;
      pointer-events: none;
      transition: color 0.15s ease;
    }
    .form-control:focus + .icon-left,
    .form-control:focus ~ .icon-left {
      color: var(--primary);
    }

    .icon-right {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 13.5px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.15s ease;
    }
    .icon-right:hover {
      color: var(--ink);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      height: 44px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }
    .btn-submit:active {
      transform: translateY(1px);
    }

    /* Footer Sign in link */
    .footer-area {
      margin-top: 22px;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      border-top: 1px solid var(--line-soft);
      padding-top: 16px;
    }
    .footer-area a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }
    .footer-area a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .user-card {
        padding: 24px 18px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- White Card Container -->
  <div class="user-card">
    
    <!-- Top Navigation -->
    <div class="nav-bar">
      <a href="/" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <span class="brand-mark">Suggu Services</span>
    </div>

    <!-- Header & Logo -->
    <div class="header-area">
      <img src="{% static 'assets/images/logo.png' %}" alt="Suggu Services Logo" class="logo-img" onerror="this.style.display='none'">
      <h1>Create User Account</h1>
      <p>Join Suggu Services to access all home and business services</p>
    </div>

    <!-- Error & Success Messages -->
    {% if error %}
    <div class="alert-box alert-error">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    {% if success %}
    <div class="alert-box alert-success">
      <i class="fa-solid fa-circle-check"></i>
      <span>{{ success }}</span>
    </div>
    {% endif %}

    <!-- Registration Form -->
    <form method="POST" action="" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div class="form-grid">
        <!-- Full Name -->
        <div class="form-group full-width">
          <label for="name">Full Name</label>
          <div class="input-wrap">
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required value="{{ request.POST.name }}">
            <i class="fa-solid fa-id-card icon-left"></i>
          </div>
        </div>
        
        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required value="{{ request.POST.email }}">
            <i class="fa-solid fa-envelope icon-left"></i>
          </div>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <div class="input-wrap">
            <input type="text" id="mobile" name="mobile" class="form-control" placeholder="Enter your mobile number" value="{{ request.POST.mobile }}">
            <i class="fa-solid fa-phone icon-left"></i>
          </div>
        </div>

        <!-- Profile Image -->
        <div class="form-group full-width">
          <label for="profile_image">Profile Image (Optional)</label>
          <div class="input-wrap">
            <input type="file" id="profile_image" name="profile_image" class="form-control file-input" accept="image/*">
            <i class="fa-solid fa-image icon-left"></i>
          </div>
        </div>
        
        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" class="form-control" placeholder="Create password" required style="padding-right: 38px;">
            <i class="fa-solid fa-lock icon-left"></i>
            <i class="fa-solid fa-eye icon-right" onclick="togglePassword('password', this)" title="Toggle view"></i>
          </div>
        </div>
        
        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required style="padding-right: 38px;">
            <i class="fa-solid fa-lock-open icon-left"></i>
            <i class="fa-solid fa-eye icon-right" onclick="togglePassword('confirm_password', this)" title="Toggle view"></i>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">
        <span>Create Account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    
    <!-- Footer Link -->
    <div class="footer-area">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>

  </div>

  <script>
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>
</body>
</html>
