{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register as User - Infinity Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(30, 27, 75, 0.7)), url("{% static 'assets/images/image.png' %}") no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: rgba(99, 102, 241, 0.4); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: rgba(236, 72, 153, 0.3); bottom: -50px; right: -50px; animation-delay: 2s; }
    
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px;
      width: 90%;
      max-width: 800px;
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-height: 90vh;
      overflow-y: auto;
    }
     
    @keyframes slideUp {
      to { transform: translateY(0); opacity: 1; }
    }

    /* Scrollbar for wrapper if needed */
    .login-wrapper::-webkit-scrollbar { width: 6px; }
    .login-wrapper::-webkit-scrollbar-track { background: transparent; }
    .login-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .logo-area {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-area .icon {
      font-size: 32px;
      background: -webkit-linear-gradient(45deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .logo-area h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-area p {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }
    .form-control {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 16px 12px 40px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .form-group .icon-left {
      position: absolute;
      left: 14px;
      top: 36px;
      color: var(--text-muted);
      font-size: 14px;
      transition: color 0.3s ease;
    }
    .form-control:focus + .icon-left, .form-control:focus ~ .icon-left {
      color: var(--primary);
    }
    
    .form-group .icon-right {
      position: absolute;
      right: 14px;
      top: 36px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: color 0.3s ease;
      z-index: 10;
    }
    .form-group .icon-right:hover {
      color: var(--text-main);
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px var(--primary);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #86efac;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .demo-creds {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
      padding-top: 16px;
    }
    .demo-creds a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .demo-creds a:hover {
      color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-wrapper">
    <div class="logo-area">
      <div class="icon"><i class="fa-solid fa-user"></i></div>
      <h1>Create User Account</h1>
      <p>Join Infinity to access our services</p>
    </div>

    {% if error %}
    <div class="error-msg">
      <i class="fa-solid fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="success-msg">
      <i class="fa-solid fa-circle-check"></i>
      {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required value="{{ request.POST.name }}">
          <i class="fa-solid fa-id-card icon-left"></i>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required value="{{ request.POST.email }}">
          <i class="fa-solid fa-envelope icon-left"></i>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="text" id="mobile" name="mobile" class="form-control" placeholder="Enter your mobile number" value="{{ request.POST.mobile }}">
          <i class="fa-solid fa-phone icon-left"></i>
        </div>

        <div class="form-group full-width">
          <label for="profile_image">Profile Image (Optional)</label>
          <input type="file" id="profile_image" name="profile_image" class="form-control" accept="image/*" style="padding-left:45px; padding-top:10px;">
          <i class="fa-solid fa-image icon-left"></i>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create password" required>
          <i class="fa-solid fa-lock icon-left"></i>
          <i class="fa-solid fa-eye icon-right" onclick="togglePassword('password', this)"></i>
        </div>
        
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
          <i class="fa-solid fa-lock-open icon-left"></i>
          <i class="fa-solid fa-eye icon-right" onclick="togglePassword('confirm_password', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Create Account <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    
    <div class="demo-creds">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
  </div>
  <script>
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>
</body>
</html>
