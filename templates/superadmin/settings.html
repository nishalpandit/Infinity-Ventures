{% extends 'superadmin/base.html' %}
{% block title %}Global Settings{% endblock %}
{% block header_title %}Global Platform Settings{% endblock %}

{% block content %}
<div class="card form-card">
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group">
      <label>Site Title</label>
      <input type="text" name="site_title" class="form-control" value="{{ settings.site_title }}">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" name="contact_email" class="form-control" value="{{ settings.contact_email }}">
      </div>
      <div class="form-group">
        <label>Support Phone</label>
        <input type="text" name="support_phone" class="form-control" value="{{ settings.support_phone }}">
      </div>
    </div>
    
    <div class="form-group">
      <label>Platform Commission (%)</label>
      <input type="number" step="0.01" name="platform_commission_percent" class="form-control" value="{{ settings.platform_commission_percent }}">
    </div>
    
    <div class="form-group">
      <label>Maintenance Mode</label>
      <label class="toggle-switch">
        <input type="checkbox" name="maintenance_mode" {% if settings.maintenance_mode %}checked{% endif %}>
        <span class="toggle-slider"></span>
      </label>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">When enabled, the public-facing site will display a maintenance page.</p>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
