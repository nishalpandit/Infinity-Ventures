{% extends 'superadmin/base.html' %}
{% block title %}Edit Bid{% endblock %}
{% block header_title %}Edit Bid{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
  <a href="{% url 'super_admin_bids' %}" style="color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;">
    <i class="fa-solid fa-arrow-left"></i> Back to Bids
  </a>
</div>

<div class="card form-card">
  <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">Edit Bid by {{ bid.vendor.username }}</h3>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-row">
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" step="0.01" name="amount" class="form-control" value="{{ bid.amount }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status" class="form-control">
          <option value="submitted" {% if bid.status == 'submitted' %}selected{% endif %}>Submitted</option>
          <option value="selected" {% if bid.status == 'selected' %}selected{% endif %}>Selected</option>
          <option value="rejected" {% if bid.status == 'rejected' %}selected{% endif %}>Rejected</option>
          <option value="withdrawn" {% if bid.status == 'withdrawn' %}selected{% endif %}>Withdrawn</option>
        </select>
      </div>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
      <a href="{% url 'super_admin_bids' %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
