{% extends 'superadmin/base.html' %}
{% block title %}Edit Vendor{% endblock %}
{% block header_title %}Edit Vendor{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
  <a href="{% url 'super_admin_vendors' %}" style="color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;">
    <i class="fa-solid fa-arrow-left"></i> Back to Vendors
  </a>
</div>

<div class="card form-card">
  <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">Edit: {{ vendor.company_name|default:vendor.user.username }}</h3>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-row">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" name="company_name" class="form-control" value="{{ vendor.company_name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Vendor Type</label>
        <select name="vendor_type" class="form-control">
          <option value="vendor" {% if vendor.vendor_type == 'vendor' %}selected{% endif %}>Individual Vendor</option>
          <option value="company" {% if vendor.vendor_type == 'company' %}selected{% endif %}>Company Vendor</option>
        </select>
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" class="form-control" value="{{ vendor.category }}">
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" class="form-control" value="{{ vendor.location }}">
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>Experience (years)</label>
        <input type="number" name="experience" class="form-control" value="{{ vendor.experience }}">
      </div>
      <div class="form-group">
        <label>Rating</label>
        <input type="number" step="0.1" min="0" max="5" name="rating" class="form-control" value="{{ vendor.rating }}">
      </div>
    </div>
    
    <div class="form-group">
      <label>About</label>
      <textarea name="about" class="form-control">{{ vendor.about|default:'' }}</textarea>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
      <a href="{% url 'super_admin_vendors' %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
