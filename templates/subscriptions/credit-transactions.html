{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Credit Transactions — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="page-head">
        <div class="ph-title">
          <h1>Bid Credit Transactions</h1>
          <p>Complete ledger of vendor bid-credit activity</p>
        </div>
        <div class="ph-actions">
          <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fa-solid fa-file-export"></i> Export</button>
        </div>
      </div>

      <div class="alert alert-info">
        <i class="fa-solid fa-coins"></i> Bid credits <strong>never expire</strong>. Used credits are <strong>never returned</strong> — withdrawn and rejected bids do not receive refunds.
      </div>

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="{% static 'assets/js/sidebar.js' %}"></script>
  <script src="{% static 'assets/js/components.js' %}"></script>
  <script src="{% static 'assets/js/admin.js' %}"></script>
  <script src="{% static 'assets/js/data.js' %}"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Subscriptions', href: '#' },
        { label: 'Credit Transactions' }
      ]);

      function typeBadge(t) {
        var map = {
          'purchased': { label: 'Purchased', cls: 'badge-green' },
          'bid-used': { label: 'Bid Used', cls: 'badge-blue' },
          'withdrawn-bid': { label: 'Withdrawn Bid', cls: 'badge-orange' },
          'rejected-bid': { label: 'Rejected Bid', cls: 'badge-red' }
        };
        var m = map[t] || { label: t, cls: 'badge-gray' };
        return '<span class="badge ' + m.cls + '">' + m.label + '</span>';
      }

      U.createTable({
        mount: '#tableMount',
        data: D.creditTxns,
        searchKeys: ['id', 'vendor', 'vendorId', 'reference', 'description'],
        searchPlaceholder: 'Search credit transactions…',
        exportName: 'credit-transactions',
        pageSize: 10,
        filters: [
          {
            key: 'type',
            options: [
              { value: 'all', label: 'All Types' },
              { value: 'purchased', label: 'Purchased' },
              { value: 'bid-used', label: 'Bid Used' },
              { value: 'withdrawn-bid', label: 'Withdrawn Bid' },
              { value: 'rejected-bid', label: 'Rejected Bid' }
            ],
            match: function (r, v) { return r.type === v; }
          }
        ],
        columns: [
          { key: 'id', label: 'Transaction ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'vendor', label: 'Vendor', sortable: true, render: function (r) { return U.userCell(r.vendor, '', r.vendorId); } },
          { key: 'type', label: 'Transaction Type', sortable: true, render: function (r) { return typeBadge(r.type); } },
          {
            key: 'credits', label: 'Credits', sortable: true, render: function (r) {
              var pos = r.credits > 0;
              return '<span class="count-pill ' + (pos ? 'green' : 'red') + '">' + (pos ? '+' : '') + r.credits + '</span>';
            }
          },
          { key: 'reference', label: 'Reference', sortable: true, render: function (r) { return '<span class="mono">' + r.reference + '</span>'; } },
          { key: 'date', label: 'Date', sortable: true, render: function (r) { return r.date; } },
          { key: 'description', label: 'Description', render: function (r) { return '<span class="text-muted">' + U.esc(r.description) + '</span>'; } }
        ]
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        U.toast('info', 'Preparing export', 'Credit transactions are being exported to CSV.');
      });
    })();
  </script>
</body>
</html>
