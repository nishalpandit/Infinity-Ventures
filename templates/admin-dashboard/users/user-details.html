<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div id="pageContent">
        <div class="state-box"><div class="spinner"></div><p>Loading User…</p></div>
      </div>
    </main>
  </div>

  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;
      var id = U.qs('id') || 'USR-1001';
      var cust = D.find(D.Users, id) || D.Users[0];

      AdminComponents.renderBreadcrumb([
        { label: 'Users', href: '#' },
        { label: 'Users', href: 'Users.html' },
        { label: cust.name }
      ]);

      var myQS = D.quickServices.filter(function (s) { return s.UserId === cust.id; });
      var myJobs = D.jobs.filter(function (j) { return j.UserId === cust.id; });
      var myReviews = D.UserReviews.filter(function (r) { return r.User === cust.name; });
      var myComplaints = D.complaints.filter(function (c) { return c.raisedBy === cust.name; });
      var vendorsSelected = myQS.filter(function (s) { return s.selectedVendor !== '—'; }).length +
        myJobs.reduce(function (s, j) { return s + j.selectedVendors; }, 0);

      function render() {
        var html = '';

        /* Profile header */
        html += '<div class="detail-hero card">' +
          '<div class="dh-left">' +
          '<span class="avatar avatar-xl ' + U.avatarClass(cust.id) + '">' + U.initials(cust.name) + '</span>' +
          '<div><h2>' + U.esc(cust.name) + '</h2>' +
          '<div class="dh-meta"><span class="mono">' + cust.id + '</span> ' + U.badge(cust.status) + '</div>' +
          '<div class="dh-sub"><i class="fa-solid fa-location-dot"></i> ' + U.esc(cust.location) +
          ' &nbsp;·&nbsp; <i class="fa-regular fa-calendar"></i> Registered ' + cust.registered + '</div></div>' +
          '</div>' +
          '<div class="dh-actions">' +
          '<button class="btn btn-outline btn-sm" id="editBtn"><i class="fa-solid fa-pen"></i> Edit</button>' +
          (cust.status === 'active'
            ? '<button class="btn btn-danger btn-sm" id="statusBtn"><i class="fa-solid fa-ban"></i> Suspend</button>'
            : '<button class="btn btn-success btn-sm" id="statusBtn"><i class="fa-solid fa-check"></i> Activate</button>') +
          '</div></div>';

        /* Stats */
        var stats = [
          { label: 'Quick Services', value: myQS.length || cust.quickServices, icon: 'fa-bolt', cls: 'icon-blue' },
          { label: 'Jobs', value: myJobs.length || cust.jobs, icon: 'fa-briefcase', cls: 'icon-purple' },
          { label: 'Completed Jobs', value: cust.completedJobs, icon: 'fa-circle-check', cls: 'icon-green' },
          { label: 'Vendors Selected', value: vendorsSelected, icon: 'fa-handshake', cls: 'icon-teal' },
          { label: 'Complaints', value: myComplaints.length, icon: 'fa-flag', cls: 'icon-red' }
        ];
        html += '<div class="stat-grid" style="margin-top:20px;">' + stats.map(function (s) {
          return '<div class="stat-card static"><span class="stat-icon ' + s.cls + '"><i class="fa-solid ' + s.icon + '"></i></span>' +
            '<div class="stat-info"><div class="label">' + s.label + '</div><div class="value">' + s.value + '</div></div></div>';
        }).join('') + '</div>';

        /* Tabs */
        html += '<div class="card" style="margin-top:20px;">' +
          '<ul class="nav nav-tabs app-tabs" role="tablist">' +
          '<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabProfile">Profile</button></li>' +
          '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabQS">Quick Services (' + myQS.length + ')</button></li>' +
          '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabJobs">Jobs (' + myJobs.length + ')</button></li>' +
          '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReviews">Reviews (' + myReviews.length + ')</button></li>' +
          '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabComplaints">Complaints (' + myComplaints.length + ')</button></li>' +
          '</ul><div class="tab-content card-body">';

        /* Profile tab */
        html += '<div class="tab-pane fade show active" id="tabProfile"><div class="row g-4">' +
          infoBlock('Contact Information', [
            ['fa-phone', 'Mobile', cust.mobile],
            ['fa-envelope', 'Email', cust.email],
            ['fa-location-dot', 'Location', cust.location]
          ]) +
          infoBlock('Account Information', [
            ['fa-id-card', 'User ID', cust.id],
            ['fa-calendar', 'Registration Date', cust.registered],
            ['fa-shield-halved', 'Account Status', cust.status === 'active' ? 'Active' : 'Suspended']
          ]) +
          '</div></div>';

        /* Quick Services tab */
        html += '<div class="tab-pane fade" id="tabQS">' + listTable(
          ['ID', 'Service', 'Category', 'Budget', 'Status', 'Created'],
          myQS.map(function (s) {
            return '<tr><td><a class="link-sm" href="../quick-services/details.html?id=' + s.id + '">' + s.id + '</a></td>' +
              '<td>' + U.esc(s.title) + '</td><td>' + U.esc(s.category) + '</td><td>' + U.inr(s.budget) + '</td>' +
              '<td>' + U.badge(s.status) + '</td><td>' + s.created + '</td></tr>';
          })
        ) + '</div>';

        /* Jobs tab */
        html += '<div class="tab-pane fade" id="tabJobs">' + listTable(
          ['ID', 'Job', 'Location', 'Budget', 'Bids', 'Status'],
          myJobs.map(function (j) {
            return '<tr><td><a class="link-sm" href="../jobs/details.html?id=' + j.id + '">' + j.id + '</a></td>' +
              '<td>' + U.esc(j.title) + '</td><td>' + U.esc(j.location) + '</td><td>' + U.inr(j.budget) + '</td>' +
              '<td>' + j.bids + '</td><td>' + U.badge(j.status) + '</td></tr>';
          })
        ) + '</div>';

        /* Reviews tab */
        html += '<div class="tab-pane fade" id="tabReviews">' + (myReviews.length === 0
          ? emptyBox('No reviews yet', 'This User has not submitted any reviews.')
          : myReviews.map(function (r) {
            return '<div class="review-item"><div class="ri-head">' +
              '<div><strong>' + U.esc(r.vendor) + '</strong> <span class="text-muted">· ' + U.esc(r.job) + '</span></div>' +
              U.stars(r.rating) + '</div><p>' + U.esc(r.review) + '</p>' +
              '<div class="text-muted" style="font-size:12px;">' + r.date + ' · ' + U.badge(r.status) + '</div></div>';
          }).join('')) + '</div>';

        /* Complaints tab */
        html += '<div class="tab-pane fade" id="tabComplaints">' + listTable(
          ['ID', 'Subject', 'Priority', 'Status', 'Created'],
          myComplaints.map(function (c) {
            return '<tr><td><a class="link-sm" href="../complaints/details.html?id=' + c.id + '">' + c.id + '</a></td>' +
              '<td>' + U.esc(c.subject) + '</td><td>' + U.badge(c.priority) + '</td><td>' + U.badge(c.status) + '</td><td>' + c.created + '</td></tr>';
          })
        ) + '</div>';

        html += '</div></div>';
        document.getElementById('pageContent').innerHTML = html;

        document.getElementById('editBtn').addEventListener('click', function () {
          U.modal({
            title: 'Edit User — ' + cust.id,
            body:
              '<div class="row g-3">' +
              '<div class="col-md-6"><label class="form-label">Name</label><input class="form-control" id="eName" value="' + U.esc(cust.name) + '"></div>' +
              '<div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" id="eMobile" value="' + U.esc(cust.mobile) + '"></div>' +
              '<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="eEmail" value="' + U.esc(cust.email) + '"></div>' +
              '<div class="col-md-6"><label class="form-label">Location</label><input class="form-control" id="eLoc" value="' + U.esc(cust.location) + '"></div>' +
              '</div>',
            onSave: function () {
              cust.name = document.getElementById('eName').value;
              cust.mobile = document.getElementById('eMobile').value;
              cust.email = document.getElementById('eEmail').value;
              cust.location = document.getElementById('eLoc').value;
              U.toast('success', 'User updated', cust.name + ' has been saved.');
              render();
            }
          });
        });

        document.getElementById('statusBtn').addEventListener('click', function () {
          if (cust.status === 'active') {
            U.confirm({
              title: 'Suspend User?', message: cust.name + ' will lose platform access.',
              danger: true, icon: 'fa-ban', confirmText: 'Suspend',
              onConfirm: function () { cust.status = 'suspended'; U.toast('warning', 'User suspended'); render(); }
            });
          } else {
            cust.status = 'active';
            U.toast('success', 'User activated');
            render();
          }
        });
      }

      function infoBlock(title, rows) {
        return '<div class="col-md-6"><div class="info-block"><h6>' + title + '</h6>' +
          rows.map(function (r) {
            return '<div class="ib-row"><span class="ib-icon"><i class="fa-solid ' + r[0] + '"></i></span>' +
              '<div><div class="ib-label">' + r[1] + '</div><div class="ib-value">' + U.esc(r[2]) + '</div></div></div>';
          }).join('') + '</div></div>';
      }

      function listTable(headers, rowsHtml) {
        if (!rowsHtml.length) return emptyBox('No records found', 'Nothing to display here yet.');
        return '<div class="table-wrap"><table class="table"><thead><tr>' +
          headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rowsHtml.join('') + '</tbody></table></div>';
      }

      function emptyBox(title, text) {
        return '<div class="state-box"><div class="state-icon"><i class="fa-regular fa-folder-open"></i></div>' +
          '<h5>' + title + '</h5><p>' + text + '</p></div>';
      }

      setTimeout(render, 350);
    })();
  </script>
</body>
</html>
