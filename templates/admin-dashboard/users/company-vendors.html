<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Vendors — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div></div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCompanyVendorModal">
          <i class="fa-solid fa-plus me-2"></i> Add Company Vendor
        </button>
      </div>

      <!-- Add Company Vendor Modal -->
      <div class="modal fade" id="addCompanyVendorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <form action="/admin-dashboard/create-company-vendor/" method="POST">
              {% csrf_token %}
              <div class="modal-header">
                <h5 class="modal-title">Add Company Vendor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Company Name</label>
                  <input type="text" class="form-control" name="company_name" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Email / Username</label>
                  <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" name="password" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Category</label>
                  <input type="text" class="form-control" name="category" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Location (City, State)</label>
                  <input type="text" class="form-control" name="location" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Employee Code</label>
                  <input type="text" class="form-control" name="employee_code">
                </div>
                <div class="mb-3">
                  <label class="form-label">Employee Details</label>
                  <textarea class="form-control" name="employee_details" rows="3"></textarea>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Vendor</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script src="/admin-dashboard/assets/js/vendor-table.js"></script>
  <script>
    (function () {
      'use strict';
      AdminComponents.renderBreadcrumb([
        { label: 'Users', href: '#' },
        { label: 'Company Vendors' }
      ]);
      var dynamicVendors = {{ vendors_json|safe|default:"[]" }};
      window.AdminData.vendors = dynamicVendors;
      VendorTable.init({ type: 'company', exportName: 'company-vendors' });
    })();
  </script>
</body>
</html>
