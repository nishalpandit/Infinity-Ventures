<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Suggu Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script>
    window.ADMIN_NAME = "{{ request.user.get_full_name|default:request.user.username }}";
    window.ADMIN_ROLE = "{% if request.user.is_superuser %}Super Admin{% elif request.user.role == 'ADMIN' %}Area Admin{% else %}Admin{% endif %}";
    window.ADMIN_STATE = "{{ admin_state|default:'' }}";
    window.ADMIN_INITIALS = "{{ request.user.username|make_list|first|upper }}";
  </script>
  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Users', href: '#' },
        { label: 'Customers' }
      ]);

      var dynamicUsers = {{ users_json|safe|default:"[]" }};
      
      var table = U.createTable({
        mount: '#tableMount',
        data: dynamicUsers,
        searchKeys: ['id', 'name', 'email', 'mobile', 'location'],
        searchPlaceholder: 'Search Customers…',
        exportName: 'customers',
        pageSize: 10,
        filters: [
          {
            key: 'status',
            options: [
              { value: 'all', label: 'All Status' },
              { value: 'active', label: 'Active' },
              { value: 'suspended', label: 'Suspended' }
            ],
            match: function (r, v) { return r.status === v; }
          }
        ],
        columns: [
          { key: 'id', label: 'Customer ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'name', label: 'Customer Profile', sortable: true, render: function (r) { return U.userCell(r.name, r.email, r.id); } },
          { key: 'mobile', label: 'Mobile', render: function (r) { return U.esc(r.mobile); } },
          { key: 'quickServices', label: 'Quick Services', sortable: true, render: function (r) { return '<span class="count-pill">' + r.quickServices + '</span>'; } },
          { key: 'jobs', label: 'Jobs', sortable: true, render: function (r) { return '<span class="count-pill">' + r.jobs + '</span>'; } },
          { key: 'completedJobs', label: 'Completed', sortable: true, render: function (r) { return '<span class="count-pill green">' + r.completedJobs + '</span>'; } },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return U.badge(r.status); } },
          { key: 'registered', label: 'Registered', sortable: true, render: function (r) { return r.registered; } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'view', icon: 'fa-eye', title: 'View', cls: 'view' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'view') {
            location.href = 'User-details.html?id=' + row.id;
          }
        }
      });
    })();
  </script>
</body>
</html>
