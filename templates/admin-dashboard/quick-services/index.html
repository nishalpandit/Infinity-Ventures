<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Services — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Quick Services', href: '#' },
        { label: 'All Quick Services' }
      ]);
      
      var quickServicesData = [];
      try {
        var rawData = '{{ quick_services_json|escapejs }}';
        if (rawData && rawData !== '""') {
          quickServicesData = JSON.parse(rawData);
        } else {
          quickServicesData = D.quickServices;
        }
      } catch(e) {
        quickServicesData = D.quickServices;
      }

      var table = U.createTable({
        mount: '#tableMount',
        data: quickServicesData,
        searchKeys: ['id', 'customer', 'title', 'category', 'location'],
        searchPlaceholder: 'Search quick services…',
        exportName: 'quick-services',
        pageSize: 10,
        filters: [
          {
            key: 'status',
            options: [
              { value: 'all', label: 'All Status' },
              { value: 'active', label: 'Active' },
              { value: 'in-progress', label: 'In Progress' },
              { value: 'completed', label: 'Completed' },
              { value: 'cancelled', label: 'Cancelled' }
            ],
            match: function (r, v) { return r.status === v; }
          },
          {
            key: 'category',
            options: [{ value: 'all', label: 'All Categories' }].concat(D.categories.map(function (c) { return { value: c, label: c }; })),
            match: function (r, v) { return r.category === v; }
          },
          {
            key: 'location',
            options: [{ value: 'all', label: 'All Locations' }].concat(D.cities.map(function (c) { return { value: c, label: c }; })),
            match: function (r, v) { return r.location === v; }
          }
        ],
        columns: [
          { key: 'id', label: 'Service ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'customer', label: 'Customer', sortable: true, render: function (r) { return U.userCell(r.customer, r.customerMobile, r.customerId); } },
          { key: 'title', label: 'Service', sortable: true, render: function (r) { return '<strong>' + U.esc(r.title) + '</strong>'; } },
          { key: 'category', label: 'Category', sortable: true, render: function (r) { return U.esc(r.category); } },
          { key: 'location', label: 'Location', sortable: true, render: function (r) { return U.esc(r.location); } },
          { key: 'budget', label: 'Budget', sortable: true, render: function (r) { return '<strong>' + U.inr(r.budget) + '</strong>'; } },
          { key: 'vendorRequests', label: 'Vendor Requests', sortable: true, render: function (r) { return '<span class="count-pill">' + r.vendorRequests + '</span>'; } },
          { key: 'selectedVendor', label: 'Selected Vendor', render: function (r) { return r.selectedVendor === '—' ? '<span class="text-muted">—</span>' : U.esc(r.selectedVendor); } },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return U.badge(r.status); } },
          { key: 'created', label: 'Created', sortable: true, render: function (r) { return r.created; } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'view', icon: 'fa-eye', title: 'View', cls: 'view' },
                { action: 'cancel', icon: 'fa-ban', title: 'Cancel', cls: 'danger' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'view') {
            location.href = 'details.html?id=' + row.id;
          } else if (act === 'cancel') {
            if (row.status === 'completed' || row.status === 'cancelled') {
              U.toast('error', 'Cannot cancel', 'This service is already ' + row.status + '.');
              return;
            }
            U.confirm({
              title: 'Cancel quick service?',
              message: row.title + ' will be marked as cancelled.',
              danger: true, icon: 'fa-ban', confirmText: 'Cancel Service',
              onConfirm: function () {
                row.status = 'cancelled';
                table.refresh();
                U.toast('warning', 'Service cancelled', row.id + ' has been cancelled.');
              }
            });
          }
        }
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        U.toast('info', 'Preparing export', 'Quick services list is being exported to CSV.');
      });
    })();
  </script>
</body>
</html>
