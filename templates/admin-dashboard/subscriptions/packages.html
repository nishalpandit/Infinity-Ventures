<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Packages — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Subscriptions', href: '#' },
        { label: 'Bid Packages' }
      ]);

      var table = U.createTable({
        mount: '#tableMount',
        data: D.packages,
        searchKeys: ['id', 'name', 'description'],
        searchPlaceholder: 'Search packages…',
        pageSize: 10,
        columns: [
          { key: 'id', label: 'Package ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'name', label: 'Package Name', sortable: true, render: function (r) { return '<strong>' + U.esc(r.name) + '</strong>'; } },
          { key: 'credits', label: 'Bid Credits', sortable: true, render: function (r) { return '<span class="count-pill blue">' + r.credits + ' credits</span>'; } },
          { key: 'price', label: 'Price', sortable: true, render: function (r) { return '<strong>' + U.inr(r.price) + '</strong>'; } },
          { key: 'description', label: 'Description', render: function (r) { return '<span class="text-muted">' + U.esc(r.description) + '</span>'; } },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return U.badge(r.status); } },
          { key: 'order', label: 'Display Order', sortable: true, render: function (r) { return r.order; } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'edit', icon: 'fa-pen', title: 'Edit', cls: 'edit' },
                { action: 'toggle', icon: r.status === 'active' ? 'fa-toggle-off' : 'fa-toggle-on', title: r.status === 'active' ? 'Deactivate' : 'Activate', cls: 'view' },
                { action: 'delete', icon: 'fa-trash', title: 'Delete', cls: 'danger' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'edit') openModal(row);
          else if (act === 'toggle') {
            row.status = row.status === 'active' ? 'inactive' : 'active';
            table.refresh();
            U.toast('success', 'Package updated', row.name + ' is now ' + row.status + '.');
          } else if (act === 'delete') {
            U.confirm({
              title: 'Delete package?',
              message: row.name + ' will be permanently removed. Existing purchases are not affected.',
              danger: true, icon: 'fa-trash', confirmText: 'Delete',
              onConfirm: function () {
                var i = D.packages.indexOf(row);
                if (i > -1) D.packages.splice(i, 1);
                table.refresh();
                U.toast('success', 'Package deleted', row.name + ' has been removed.');
              }
            });
          }
        }
      });

      function openModal(pkg) {
        var isNew = !pkg;
        pkg = pkg || { name: '', credits: 5, price: 100, description: '', status: 'active', order: D.packages.length + 1 };
        U.modal({
          title: isNew ? 'Create Package' : 'Edit Package — ' + pkg.name,
          body:
            '<div class="row g-3">' +
            '<div class="col-md-6"><label class="form-label">Package Name</label><input type="text" class="form-control" id="pkgName" value="' + U.esc(pkg.name) + '"></div>' +
            '<div class="col-md-3"><label class="form-label">Bid Credits</label><input type="number" class="form-control" id="pkgCredits" value="' + pkg.credits + '" min="1"></div>' +
            '<div class="col-md-3"><label class="form-label">Price (₹)</label><input type="number" class="form-control" id="pkgPrice" value="' + pkg.price + '" min="1"></div>' +
            '<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="pkgDesc" rows="2">' + U.esc(pkg.description) + '</textarea></div>' +
            '<div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="pkgStatus">' +
            '<option value="active"' + (pkg.status === 'active' ? ' selected' : '') + '>Active</option>' +
            '<option value="inactive"' + (pkg.status === 'inactive' ? ' selected' : '') + '>Inactive</option></select></div>' +
            '<div class="col-md-6"><label class="form-label">Display Order</label><input type="number" class="form-control" id="pkgOrder" value="' + pkg.order + '" min="1"></div>' +
            '</div>',
          footer: '<button class="btn btn-outline btn-sm" data-close>Cancel</button><button class="btn btn-primary btn-sm" id="savePkg"><i class="fa-solid fa-check"></i> ' + (isNew ? 'Create' : 'Save Changes') + '</button>',
          onShown: function () {
            document.getElementById('savePkg').addEventListener('click', function () {
              var name = document.getElementById('pkgName').value.trim();
              var credits = parseInt(document.getElementById('pkgCredits').value, 10);
              var price = parseInt(document.getElementById('pkgPrice').value, 10);
              if (!name || !credits || !price) { U.toast('error', 'Missing fields', 'Please fill all required fields.'); return; }
              pkg.name = name;
              pkg.credits = credits;
              pkg.price = price;
              pkg.description = document.getElementById('pkgDesc').value.trim();
              pkg.status = document.getElementById('pkgStatus').value;
              pkg.order = parseInt(document.getElementById('pkgOrder').value, 10) || 1;
              if (isNew) {
                pkg.id = 'PKG-' + String(D.packages.length + 1).padStart(2, '0');
                D.packages.push(pkg);
              }
              table.refresh();
              U.closeModal();
              U.toast('success', isNew ? 'Package created' : 'Package updated', name + ' saved successfully.');
            });
          }
        });
      }

      document.getElementById('createBtn').addEventListener('click', function () { openModal(null); });
    })();
  </script>
</body>
</html>
