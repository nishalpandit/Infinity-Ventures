<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Details — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="pageContent">
        <div class="state-box"><div class="spinner"></div><p>Loading transaction…</p></div>
      </div>
    </main>
  </div>

  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;
      var id = U.qs('id') || 'TXN-7001';
      var txn = D.find(D.purchases, id) || D.purchases[0];

      AdminComponents.renderBreadcrumb([
        { label: 'Payments', href: 'index.html' },
        { label: txn.id }
      ]);

      /* Deterministic gateway details derived from the transaction */
      var methods = ['UPI', 'Credit Card', 'Debit Card', 'Net Banking', 'Wallet'];
      var method = methods[txn.id.charCodeAt(txn.id.length - 1) % methods.length];
      var gatewayId = 'GW' + txn.id.replace(/\D/g, '') + 'IN';

      function render() {
        var html = '';

        html += '<div class="detail-hero card">' +
          '<div class="dh-left">' +
          '<span class="avatar avatar-xl ' + U.avatarClass(txn.id) + '"><i class="fa-solid fa-credit-card"></i></span>' +
          '<div><h2>Transaction ' + txn.id + '</h2>' +
          '<div class="dh-meta"><span class="mono">' + txn.id + '</span> ' + U.badge(txn.paymentStatus) + '</div>' +
          '<div class="dh-sub"><i class="fa-solid fa-user-gear"></i> ' + U.esc(txn.vendor) +
          ' &nbsp;·&nbsp; <i class="fa-regular fa-calendar"></i> ' + txn.date + '</div></div>' +
          '</div>' +
          '<div class="dh-actions">' +
          '<a class="btn btn-outline btn-sm" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>' +
          '</div></div>';

        var stats = [
          { label: 'Amount', value: U.inr(txn.amount), icon: 'fa-indian-rupee-sign', cls: 'icon-green' },
          { label: 'Bid Credits', value: txn.credits, icon: 'fa-coins', cls: 'icon-purple' },
          { label: 'Payment Method', value: method, icon: 'fa-wallet', cls: 'icon-blue' },
          { label: 'Status', value: txn.paymentStatus, icon: 'fa-circle-info', cls: txn.paymentStatus === 'success' ? 'icon-teal' : 'icon-red' }
        ];
        html += '<div class="stat-grid" style="margin-top:20px;">' + stats.map(function (s) {
          return '<div class="stat-card static"><span class="stat-icon ' + s.cls + '"><i class="fa-solid ' + s.icon + '"></i></span>' +
            '<div class="stat-info"><div class="label">' + s.label + '</div><div class="value">' + s.value + '</div></div></div>';
        }).join('') + '</div>';

        html += '<div class="row g-4" style="margin-top:20px;">';
        html += '<div class="col-lg-6"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-receipt"></i> Transaction Information</h6></div><div class="card-body">' +
          infoRow('fa-hashtag', 'Transaction ID', txn.id) +
          infoRow('fa-box', 'Package', txn.package) +
          infoRow('fa-coins', 'Bid Credits', txn.credits + ' credit(s)') +
          infoRow('fa-indian-rupee-sign', 'Amount', U.inr(txn.amount)) +
          infoRow('fa-calendar', 'Purchase Date', txn.date) +
          infoRow('fa-circle-info', 'Payment Status', txn.paymentStatus) +
          '</div></div></div>';

        html += '<div class="col-lg-6"><div class="card"><div class="card-header"><h6><i class="fa-solid fa-building-columns"></i> Payment Details</h6></div><div class="card-body">' +
          infoRow('fa-user-gear', 'Vendor', txn.vendor) +
          infoRow('fa-id-card', 'Vendor ID', txn.vendorId) +
          infoRow('fa-user-tag', 'Vendor Type', txn.vendorType === 'company' ? 'Company Vendor' : 'Outsider Vendor') +
          infoRow('fa-wallet', 'Payment Method', method) +
          infoRow('fa-key', 'Gateway Transaction ID', gatewayId) +
          '</div></div></div>';
        html += '</div>';

        html += '<div class="alert alert-info" style="margin-top:20px;">' +
          '<i class="fa-solid fa-circle-info"></i> This transaction represents a <strong>vendor subscription / bid-credit purchase</strong>. ' +
          'The platform does not process customer-to-vendor service payments — those are paid directly by the customer to the vendor.</div>';

        document.getElementById('pageContent').innerHTML = html;
      }

      function infoRow(icon, label, value) {
        return '<div class="ib-row"><span class="ib-icon"><i class="fa-solid ' + icon + '"></i></span>' +
          '<div><div class="ib-label">' + label + '</div><div class="ib-value">' + U.esc(value) + '</div></div></div>';
      }

      setTimeout(render, 350);
    })();
  </script>
</body>
</html>
