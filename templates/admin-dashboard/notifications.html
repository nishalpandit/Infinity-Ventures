<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <!-- Create / Send Notification Modal -->
  <div class="modal fade" id="notifModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-bell"></i> Create Notification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="notifForm">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Notification Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nTitle" placeholder="e.g. New bid package available" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Type</label>
                <select class="form-select" id="nType">
                  <option value="general">General</option>
                  <option value="promotion">Promotion</option>
                  <option value="alert">Alert</option>
                  <option value="update">Update</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <textarea class="form-control" id="nDesc" rows="4" placeholder="Write the notification message…" required></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Recipient <span class="text-danger">*</span></label>
                <select class="form-select" id="nRecipient">
                  <option value="all-customers">All Customers</option>
                  <option value="all-vendors">All Vendors</option>
                  <option value="company-vendors">Company Vendors</option>
                  <option value="outsider-vendors">Outsider Vendors</option>
                  <option value="specific">Specific User</option>
                </select>
              </div>
              <div class="col-md-6" id="specificUserWrap" style="display:none;">
                <label class="form-label">Select User</label>
                <select class="form-select" id="nSpecificUser"></select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> Send Notification</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Notifications' }
      ]);

      var modal = new bootstrap.Modal(document.getElementById('notifModal'));

      function recipientLabel(r) {
        var map = {
          'all-customers': 'All Customers',
          'all-vendors': 'All Vendors',
          'company-vendors': 'Company Vendors',
          'outsider-vendors': 'Outsider Vendors'
        };
        return map[r] || r;
      }

      var table = U.createTable({
        mount: '#tableMount',
        data: D.notifications,
        searchKeys: ['id', 'title', 'description', 'recipient'],
        searchPlaceholder: 'Search notifications…',
        exportName: 'notifications',
        pageSize: 10,
        filters: [
          {
            key: 'type',
            options: [
              { value: 'all', label: 'All Types' },
              { value: 'general', label: 'General' },
              { value: 'promotion', label: 'Promotion' },
              { value: 'alert', label: 'Alert' },
              { value: 'update', label: 'Update' }
            ],
            match: function (r, v) { return r.type === v; }
          },
          {
            key: 'read',
            options: [
              { value: 'all', label: 'Read + Unread' },
              { value: 'read', label: 'Read' },
              { value: 'unread', label: 'Unread' }
            ],
            match: function (r, v) { return r.read === v; }
          }
        ],
        columns: [
          { key: 'title', label: 'Title', sortable: true, render: function (r) { return '<strong>' + U.esc(r.title) + '</strong>'; } },
          { key: 'description', label: 'Description', render: function (r) { return '<span class="text-muted">' + U.esc(r.description) + '</span>'; } },
          { key: 'recipient', label: 'Recipient', sortable: true, render: function (r) { return '<span class="count-pill">' + U.esc(recipientLabel(r.recipient)) + '</span>'; } },
          { key: 'type', label: 'Type', sortable: true, render: function (r) { return U.badge(r.type); } },
          { key: 'date', label: 'Date', sortable: true, render: function (r) { return r.date; } },
          {
            key: 'read', label: 'Status', sortable: true, render: function (r) {
              return r.read === 'read'
                ? '<span class="badge badge-gray"><i class="fa-solid fa-envelope-open"></i> Read</span>'
                : '<span class="badge badge-blue"><i class="fa-solid fa-envelope"></i> Unread</span>';
            }
          },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'toggle', icon: r.read === 'read' ? 'fa-envelope' : 'fa-envelope-open', title: r.read === 'read' ? 'Mark Unread' : 'Mark Read', cls: 'view' },
                { action: 'delete', icon: 'fa-trash', title: 'Delete', cls: 'danger' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'toggle') {
            row.read = row.read === 'read' ? 'unread' : 'read';
            table.refresh();
            U.toast('success', 'Notification updated', 'Marked as ' + row.read + '.');
          } else if (act === 'delete') {
            U.confirm({
              title: 'Delete notification?',
              message: '"' + row.title + '" will be permanently removed.',
              danger: true, icon: 'fa-trash', confirmText: 'Delete',
              onConfirm: function () {
                var i = D.notifications.indexOf(row);
                if (i > -1) D.notifications.splice(i, 1);
                table.refresh();
                U.toast('success', 'Notification deleted', 'The notification has been removed.');
              }
            });
          }
        }
      });

      /* Create modal */
      document.getElementById('createBtn').addEventListener('click', function () {
        document.getElementById('notifForm').reset();
        document.getElementById('specificUserWrap').style.display = 'none';
        modal.show();
      });

      document.getElementById('nRecipient').addEventListener('change', function () {
        var wrap = document.getElementById('specificUserWrap');
        if (this.value === 'specific') {
          wrap.style.display = '';
          var sel = document.getElementById('nSpecificUser');
          sel.innerHTML = '<option value="">Select a user…</option>' +
            D.customers.map(function (c) { return '<option value="' + c.id + '">Customer — ' + U.esc(c.name) + '</option>'; }).join('') +
            D.vendors.map(function (v) { return '<option value="' + v.id + '">Vendor — ' + U.esc(v.name) + '</option>'; }).join('');
        } else {
          wrap.style.display = 'none';
        }
      });

      document.getElementById('sendBtn').addEventListener('click', function () {
        var title = document.getElementById('nTitle').value.trim();
        var desc = document.getElementById('nDesc').value.trim();
        var recipient = document.getElementById('nRecipient').value;
        var specific = document.getElementById('nSpecificUser').value;

        if (!title || !desc) {
          U.toast('error', 'Missing fields', 'Please fill in the title and description.');
          return;
        }
        if (recipient === 'specific' && !specific) {
          U.toast('error', 'Select a user', 'Please choose a specific user.');
          return;
        }

        var now = new Date();
        D.notifications.unshift({
          id: 'NTF-' + (900 + D.notifications.length),
          title: title,
          description: desc,
          recipient: recipient === 'specific' ? specific : recipient,
          type: document.getElementById('nType').value,
          date: now.toISOString().slice(0, 10),
          read: 'unread'
        });
        table.refresh();
        modal.hide();
        U.toast('success', 'Notification sent', 'Your notification has been sent to ' + recipientLabel(recipient === 'specific' ? specific : recipient) + '.');
      });
    })();
  </script>
</body>
</html>
