<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Bids — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      

      <div class="card">
        <div class="card-body p-0" id="tableMount"></div>
      </div>
    </main>
  </div>

  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  <script src="/admin-dashboard/assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      var D = window.AdminData, U = window.AdminUI;

      AdminComponents.renderBreadcrumb([
        { label: 'Bidding', href: '#' },
        { label: 'All Bids' }
      ]);

      var table = U.createTable({
        mount: '#tableMount',
        data: D.bids,
        searchKeys: ['id', 'jobTitle', 'vendor', 'vendorId'],
        searchPlaceholder: 'Search bids…',
        exportName: 'bids',
        pageSize: 10,
        filters: [
          {
            key: 'status',
            options: [
              { value: 'all', label: 'All Status' },
              { value: 'submitted', label: 'Submitted' },
              { value: 'selected', label: 'Selected' },
              { value: 'rejected', label: 'Rejected' },
              { value: 'withdrawn', label: 'Withdrawn' }
            ],
            match: function (r, v) { return r.status === v; }
          },
          {
            key: 'vendorType',
            options: [
              { value: 'all', label: 'All Vendor Types' },
              { value: 'company', label: 'Company Vendor' },
              { value: 'outsider', label: 'Outsider Vendor' }
            ],
            match: function (r, v) { return r.vendorType === v; }
          }
        ],
        columns: [
          { key: 'id', label: 'Bid ID', sortable: true, render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },
          { key: 'jobTitle', label: 'Job', sortable: true, render: function (r) { return '<strong>' + U.esc(r.jobTitle) + '</strong><div class="text-muted" style="font-size:12px;">' + r.jobId + '</div>'; } },
          { key: 'vendor', label: 'Vendor', sortable: true, render: function (r) { return U.userCell(r.vendor, r.vendorEmail, r.vendorId); } },
          { key: 'vendorType', label: 'Vendor Type', sortable: true, render: function (r) { return U.badge(r.vendorType); } },
          { key: 'quotation', label: 'Quotation', sortable: true, render: function (r) { return '<strong>' + U.inr(r.quotation) + '</strong>'; } },
          { key: 'creditUsed', label: 'Credit Used', sortable: true, render: function (r) { return '<span class="count-pill blue">' + r.creditUsed + '</span>'; } },
          { key: 'submitted', label: 'Submitted', sortable: true, render: function (r) { return r.submitted; } },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return U.badge(r.status); } },
          {
            key: 'actions', label: 'Actions', csv: false, render: function (r) {
              return U.actionBtns([
                { action: 'view', icon: 'fa-eye', title: 'View', cls: 'view' },
                { action: 'reject', icon: 'fa-circle-xmark', title: 'Reject', cls: 'danger' }
              ]);
            }
          }
        ],
        onAction: function (act, row) {
          if (act === 'view') {
            location.href = 'bid-details.html?id=' + row.id;
          } else if (act === 'reject') {
            if (row.status !== 'submitted') {
              U.toast('error', 'Cannot reject', 'Only submitted bids can be rejected.');
              return;
            }
            U.confirm({
              title: 'Reject bid?',
              message: row.vendor + "'s bid on " + row.jobTitle + ' will be rejected. The bid credit will NOT be returned.',
              danger: true, icon: 'fa-circle-xmark', confirmText: 'Reject Bid',
              onConfirm: function () {
                row.status = 'rejected';
                table.refresh();
                U.toast('warning', 'Bid rejected', row.id + ' has been rejected. Credit not returned.');
              }
            });
          }
        }
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        U.toast('info', 'Preparing export', 'Bids list is being exported to CSV.');
      });
    })();
  </script>
</body>
</html>
