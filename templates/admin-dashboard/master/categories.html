<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories Master — Infinity Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/admin.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/sidebar.css">
  <link rel="stylesheet" href="/admin-dashboard/assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main-wrapper">
    <div id="header-mount"></div>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" onclick="CategoryManager.openAddModal()"><i class="fa-solid fa-plus"></i> Add Category</button>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table admin-table m-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Category Name</th>
                  <th>Service Type</th>
                  <th>Status</th>
                  <th>Created At</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody">
                <!-- Data will be injected here via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="categoryForm" onsubmit="CategoryManager.submitForm(event)">
          <div class="modal-header">
            <h5 class="modal-title" id="categoryModalLabel">Add Category</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="catId" name="id">
            
            <div class="mb-3">
              <label for="catName" class="form-label">Category Name</label>
              <input type="text" class="form-control" id="catName" name="name" required placeholder="e.g. Plumbing">
            </div>
            
            <div class="mb-3">
              <label for="catType" class="form-label">Service Type</label>
              <select class="form-select" id="catType" name="service_type" required>
                <option value="both">Both (Jobs & Quick Services)</option>
                <option value="job">Job Only</option>
                <option value="quick_service">Quick Service Only</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label for="catStatus" class="form-label">Status</label>
              <select class="form-select" id="catStatus" name="status" required>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div id="catError" class="text-danger small d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="catSubmitBtn">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin-dashboard/assets/js/sidebar.js"></script>
  <script src="/admin-dashboard/assets/js/components.js"></script>
  <script src="/admin-dashboard/assets/js/admin.js"></script>
  
  <script>
    (function () {
      'use strict';
      AdminComponents.renderBreadcrumb([
        { label: 'Master', href: '#' },
        { label: 'Categories' }
      ]);
    })();

    // Inject categories dynamically from django
    const initialCategories = {{ categories_json|safe|default:"[]" }};

    window.CategoryManager = (function() {
      let categories = initialCategories;
      let modalInstance = null;

      function getCsrfToken() {
        const name = 'csrftoken';
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }

      function getBadgeClass(status) {
        if(status === 'active') return 'bg-success';
        if(status === 'inactive') return 'bg-secondary';
        return 'bg-dark';
      }

      function getTypeLabel(type) {
        if(type === 'both') return 'Both';
        if(type === 'job') return 'Job';
        if(type === 'quick_service') return 'Quick Service';
        return type;
      }

      function renderTable() {
        const tbody = document.getElementById('categoryTableBody');
        if (categories.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No categories found.</td></tr>';
          return;
        }

        let html = '';
        categories.forEach(cat => {
          html += `
            <tr>
              <td class="fw-medium text-muted">#${cat.id}</td>
              <td class="fw-semibold">${cat.name}</td>
              <td>${getTypeLabel(cat.service_type)}</td>
              <td><span class="badge ${getBadgeClass(cat.status)}">${cat.status}</span></td>
              <td class="text-muted">${cat.created_at}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-icon text-primary bg-primary bg-opacity-10 rounded" onclick="CategoryManager.openEditModal(${cat.id})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-icon text-danger bg-danger bg-opacity-10 rounded ms-1" onclick="CategoryManager.deleteCategory(${cat.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function getModal() {
        if (!modalInstance) {
          modalInstance = new bootstrap.Modal(document.getElementById('categoryModal'));
        }
        return modalInstance;
      }

      function openAddModal() {
        document.getElementById('categoryForm').reset();
        document.getElementById('catId').value = '';
        document.getElementById('categoryModalLabel').textContent = 'Add Category';
        document.getElementById('catError').classList.add('d-none');
        getModal().show();
      }

      function openEditModal(id) {
        const cat = categories.find(c => c.id === id);
        if(!cat) return;
        
        document.getElementById('categoryForm').reset();
        document.getElementById('catId').value = cat.id;
        document.getElementById('catName').value = cat.name;
        document.getElementById('catType').value = cat.service_type;
        document.getElementById('catStatus').value = cat.status;
        
        document.getElementById('categoryModalLabel').textContent = 'Edit Category';
        document.getElementById('catError').classList.add('d-none');
        getModal().show();
      }

      async function submitForm(e) {
        e.preventDefault();
        const errorEl = document.getElementById('catError');
        const btn = document.getElementById('catSubmitBtn');
        errorEl.classList.add('d-none');
        
        const id = document.getElementById('catId').value;
        const name = document.getElementById('catName').value;
        const service_type = document.getElementById('catType').value;
        const status = document.getElementById('catStatus').value;

        const isEdit = !!id;
        const url = isEdit ? '/api/update-category/' : '/api/add-category/';
        
        const payload = { name, service_type, status };
        if(isEdit) payload.id = parseInt(id);

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          
          if(data.success) {
            if(isEdit) {
              const idx = categories.findIndex(c => c.id === parseInt(id));
              if(idx !== -1) categories[idx] = data.category;
            } else {
              categories.unshift(data.category);
            }
            renderTable();
            getModal().hide();
            if (window.AdminUI && window.AdminUI.toast) {
              window.AdminUI.toast('success', 'Success', isEdit ? 'Category updated successfully' : 'Category added successfully');
            } else {
              alert('Saved successfully!');
            }
          } else {
            errorEl.textContent = data.error || 'Failed to save.';
            errorEl.classList.remove('d-none');
          }
        } catch(err) {
          errorEl.textContent = 'A network error occurred.';
          errorEl.classList.remove('d-none');
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Save Category';
        }
      }

      async function deleteCategory(id) {
        if(!confirm('Are you sure you want to delete this category?')) return;
        
        try {
          const res = await fetch('/api/delete-category/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ id })
          });
          const data = await res.json();
          if(data.success) {
            categories = categories.filter(c => c.id !== id);
            renderTable();
            if (window.AdminUI && window.AdminUI.toast) {
              window.AdminUI.toast('success', 'Deleted', 'Category deleted successfully');
            } else {
              alert('Deleted successfully!');
            }
          } else {
            alert(data.error || 'Failed to delete category');
          }
        } catch(err) {
          alert('A network error occurred');
        }
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', renderTable);

      return {
        openAddModal,
        openEditModal,
        deleteCategory,
        submitForm
      };
    })();
  </script>
</body>
</html>
